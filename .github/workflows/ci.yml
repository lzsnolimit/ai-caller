name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Offline checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/common/ai/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r server/requirements-test.txt
          npm --prefix server/common/ai ci
      - name: Run all offline checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/check.py
