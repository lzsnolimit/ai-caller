[Service]
Environment=SPA_PLUGIN_DIR=%h/.local/lib/phone-call-gateway/runtime/spa-0.2
Environment=SPA_DATA_DIR=%h/.local/lib/phone-call-gateway/runtime/spa-data
# Native HFP info logs can contain dialed numbers. Keep only errors.
Environment=PIPEWIRE_DEBUG=1
Environment=WIREPLUMBER_DEBUG=1
Restart=on-failure
RestartSec=2
